<!DOCTYPE html>
<html lang="zh-Hant" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FQS War Room</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05080f; --card:rgba(16,24,34,.96); --card2:#111c2d; --card3:#121f30;
  --border:rgba(80,140,255,.22); --border2:#1d2d44; --text:#e6eef8; --muted:#7a92b2; --muted2:#445a78;
  --blue:#3b82ff; --blue-glow:rgba(59,130,255,.28); --red:#ff4d5a; --green:#12d98a;
  --shadow:0 16px 48px rgba(0,0,0,.6);
}
[data-theme="light"]{
  --bg:#eef4ff; --card:rgba(255,255,255,.98); --card2:#ffffff; --card3:#e8eef8;
  --border:rgba(59,130,255,.22); --border2:#d4dfe9; --text:#0f1e33; --muted:#6b86a3; --muted2:#a3b8ce;
  --blue:#2563eb; --blue-glow:rgba(59,130,255,.18); --red:#e84550; --green:#0ebf7a;
  --shadow:0 12px 32px rgba(37,99,235,.14);
}
*{box-sizing:border-box;margin:0;padding:0;min-width:0}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans TC',system-ui,sans-serif;min-height:100vh}
body::before{content:'';position:fixed;inset:0;pointer-events:none;background:radial-gradient(800px at 20% -10%,var(--blue-glow),transparent 65%)}
.mono{font-family:'IBM Plex Mono',monospace}
.no-scrollbar::-webkit-scrollbar{display:none}.no-scrollbar{-ms-overflow-style:none;scrollbar-width:none}
.card{background:var(--card);backdrop-filter:blur(20px);border:1px solid var(--border);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.05)}
.icon-btn{width:38px;height:38px;border-radius:12px;background:var(--card2);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;flex-shrink:0}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
/* FIX: 三塊不跑版 */
.kpi-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%}
.kpi-box{border-radius:16px;background:var(--card3);border:1px solid var(--border2);padding:12px 10px;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.kpi-label{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi-val{font-size:15px;font-weight:700;margin-top:8px;white-space:nowrap;line-height:1.1}
.kpi-sub{font-size:10px;color:var(--muted2);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* FIX: 月度方塊乾淨底線 */
.month-pill{flex:0 0 76px;height:56px;border-radius:12px;background:var(--card3)!important;border:1px solid var(--border2)!important;border-bottom:3px solid var(--c)!important;display:flex;flex-direction:column;justify-content:center;padding:8px 10px;min-width:0}
</style>
</head>
<body>
<div style="max-width:720px;margin:0 auto;padding:20px 14px 40px;position:relative">

  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:10px">
    <div style="display:flex;align-items:center;gap:10px;min-width:0"><div class="card" style="width:40px;height:40px;border-radius:14px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 20px var(--blue-glow);flex-shrink:0"><div style="width:11px;height:11px;border-radius:50%;background:var(--red);box-shadow:0 0 12px var(--red)"></div></div><div style="min-width:0"><div style="font-size:15px;font-weight:700;line-height:1.1">FQS War<br>Room</div><div class="mono" style="font-size:9px;color:var(--muted);letter-spacing:.06em;margin-top:2px">STRATEGY COMMAND • DAILY SYNC</div></div></div>
    <div style="display:flex;align-items:center;gap:8px;flex-shrink:0"><button id="themeBtn" class="icon-btn"><span id="themeIcon">☀️</span></button><div class="card mono" style="height:36px;padding:0 10px;border-radius:99px;display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;white-space:nowrap"><div style="width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 2s infinite;flex-shrink:0"></div><span id="syncTime">--</span><span style="color:var(--muted);font-size:9px;font-weight:400">TPE</span></div></div>
  </div>

  <div style="position:relative;margin-bottom:16px">
    <button id="dropBtn" class="card" style="width:100%;height:62px;border-radius:18px;padding:0 14px;display:flex;justify-content:space-between;align-items:center;text-align:left;cursor:pointer;min-width:0"><div style="flex:1;min-width:0"><div style="display:flex;align-items:center;gap:6px;min-width:0"><span id="selName" style="font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">載入中...</span><span id="selStatus" class="mono" style="font-size:9px;padding:2px 6px;border-radius:6px;border:1px solid;font-weight:600;flex-shrink:0"></span></div><div class="mono" style="font-size:10px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"><span id="selId"></span> • <span id="selPeriod"></span></div></div><div style="width:32px;height:32px;border-radius:50%;background:var(--card3);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;margin-left:8px;color:var(--muted);flex-shrink:0">▼</div></button>
    <div id="dropList" class="card" style="display:none;position:absolute;z-index:20;top:70px;width:100%;border-radius:18px;overflow:hidden"></div>
  </div>

  <div id="mainCard" class="card" style="border-radius:26px;padding:16px;margin-bottom:16px;overflow:hidden">
    <div style="display:flex;justify-content:space-between;gap:8px"><div style="min-width:0"><div class="mono" style="font-size:10px;color:var(--muted);white-space:nowrap">回測期間 • BACKTEST PERIOD</div><div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap"><span id="mStartEnd" class="mono" style="font-size:11px;font-weight:700;background:var(--card3);border:1px solid var(--border2);padding:6px 10px;border-radius:99px;color:var(--text);white-space:nowrap"></span><span id="mPeriodShort" class="mono" style="font-size:10px;background:var(--card3);border:1px solid var(--border2);color:var(--muted);padding:4px 8px;border-radius:99px;white-space:nowrap"></span></div></div><div id="mTrades" class="mono" style="width:40px;height:40px;border-radius:12px;background:var(--card3);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted);font-weight:700;flex-shrink:0"></div></div>

    <div class="kpi-grid" style="margin-top:16px">
      <div class="kpi-box"><div class="kpi-label mono">年化 • ANNUAL</div><div id="mAnnual" class="kpi-val mono"></div><div id="mMarket" class="kpi-sub mono"></div></div>
      <div class="kpi-box"><div class="kpi-label mono">超額 • DIFF</div><div id="mDiff" class="kpi-val mono"></div><div id="mDiffLabel" class="kpi-sub mono"></div></div>
      <div class="kpi-box"><div class="kpi-label mono">勝率 / 回撤</div><div id="mWin" class="kpi-val mono"></div><div class="kpi-sub mono"><span id="mDD"></span><span id="mTrades2"></span></div></div>
    </div>

    <div style="margin-top:18px"><div class="mono" style="font-size:10px;color:var(--muted);margin-bottom:8px">月度表現 • 獨立標籤</div><div id="mMonths" style="display:flex;gap:8px;overflow-x:auto;padding-bottom:2px" class="no-scrollbar"></div></div>
  </div>

  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px"><h2 style="font-size:12px;font-weight:600;color:var(--text);white-space:nowrap">全部策略 • 各自回測窗</h2><span id="totalCount" class="mono" style="font-size:9px;background:var(--card2);border:1px solid var(--border2);color:var(--muted);padding:4px 8px;border-radius:99px;white-space:nowrap"></span></div>
  <div id="allList" style="display:flex;flex-direction:column;gap:10px"></div>
</div>

<script>
const MOCK=`strategy_id,strategy_name,start_date,end_date,annual,market,diff,win_rate,drawdown,trades,status,months
S001,20~100回檔乖離動能 v2,2026/03/01,2026/08/31,10.04,31.44,-21.4,35.5,-3.8,307,觀察中,2026/03:1.43|2026/04:3.75|2026/05:1.33|2026/06:5.05|2026/07:0.23|2026/08:-1.76`;

function parseLine(l){let o=[],c='',q=false;for(let i=0;i<l.length;i++){let ch=l[i];if(ch=='"'){if(q&&l[i+1]=='"'){c+='"';i++;}else q=!q;}else if(ch==','&&!q){o.push(c.trim());c='';}else c+=ch;}o.push(c.trim());return o.map(s=>s.replace(/^"(.*)"$/,'$1'));}
function parseMonth(t){t=t.trim();if(!t)return null;let k=t.lastIndexOf(':');if(k==-1)return null;let v=parseFloat(t.slice(k+1));if(isNaN(v))return null;let lab=t.slice(0,k);let m=lab.match(/(\d{4})[\/-](\d{1,2})/);let sh=m?m[2].padStart(2,'0')+'月':lab;return{short:sh,value:v};}
function shortPeriod(s,e){let a=s.match(/(\d{4})[\/-](\d{1,2})/),b=e.match(/(\d{4})[\/-](\d{1,2})/);if(a&&b)return `${a[2].padStart(2,'0')}-${b[2].padStart(2,'0')}月`;return `${s}~${e}`;}
function parseCSV(txt){
  let lines=txt.split(/\r?\n/).filter(x=>x.trim()); if(lines.length<2) return [];
  let hdr=parseLine(lines[0]).map(h=>h.toLowerCase()), idx={}; hdr.forEach((h,i)=>idx[h]=i);
  let hasM=hdr.includes('months'), res=[];
  for(let r=1;r<lines.length;r++){
    let cols=parseLine(lines[r]); if(cols.join('').trim()==='') continue;
    while(cols.length<hdr.length) cols.push('');
    let g=k=>cols[idx[k]]||'';
    if(!g('strategy_id') &&!g('strategy_name')) continue;
    let months=[]; if(hasM){ (g('months')||'').split('|').forEach(t=>{let o=parseMonth(t); if(o) months.push(o);}); }
    if(months.length===0) continue;
    res.push({id:g('strategy_id')||`S${r}`,name:g('strategy_name')||g('strategy_id'),start_date:g('start_date'),end_date:g('end_date'),annual:parseFloat(g('annual'))||0,market:parseFloat(g('market'))||0,diff:parseFloat(g('diff'))||0,win_rate:parseFloat(g('win_rate'))||0,drawdown:parseFloat(g('drawdown'))||0,trades:parseInt(g('trades'))||0,status:g('status')||'正常',months,periodShort:shortPeriod(g('start_date'),g('end_date'))});
  }
  return res;
}
let strategies=[], selectedId=null;
function initTheme(){let s=localStorage.getItem('fqs-theme')||'dark';document.documentElement.setAttribute('data-theme',s);document.getElementById('themeIcon').textContent=s==='dark'?'☀️':'🌙';}
function toggleTheme(){let c=document.documentElement.getAttribute('data-theme');let n=c==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);localStorage.setItem('fqs-theme',n);document.getElementById('themeIcon').textContent=n==='dark'?'☀️':'🌙';}
function renderMain(){
  let s=strategies.find(x=>x.id===selectedId)||strategies[0]; if(!s) return;
  document.getElementById('selName').textContent=s.name;
  document.getElementById('selId').textContent=s.id;
  document.getElementById('selPeriod').textContent=s.start_date+' → '+s.end_date;
  let st=document.getElementById('selStatus'); st.textContent=s.status;
  st.style.background=s.status==='正常'?'rgba(18,217,138,.14)':s.status==='觀察中'?'rgba(255,174,0,.14)':'rgba(255,77,90,.14)';
  st.style.borderColor=s.status==='正常'?'rgba(18,217,138,.28)':s.status==='觀察中'?'rgba(255,174,0,.28)':'rgba(255,77,90,.28)';
  st.style.color=s.status==='正常'?'var(--green)':s.status==='觀察中'?'#ffae00':'var(--red)';
  document.getElementById('mStartEnd').textContent=s.start_date+' - '+s.end_date;
  document.getElementById('mPeriodShort').textContent=s.periodShort+' • '+s.months.length+'個月';
  document.getElementById('mTrades').textContent=s.trades;
  let a=document.getElementById('mAnnual'); a.textContent=(s.annual>=0?'+':'')+s.annual.toFixed(2)+'%'; a.style.color=s.annual>=0?'var(--red)':'var(--green)';
  document.getElementById('mMarket').textContent='vs 市場 '+s.market.toFixed(2)+'%';
  let d=document.getElementById('mDiff'); d.textContent=(s.diff>0?'+':'')+s.diff.toFixed(1)+'%'; d.style.color=s.diff>=0?'var(--red)':'var(--green)';
  document.getElementById('mDiffLabel').textContent=s.diff>=0?'領先大盤':'落後大盤';
  let w=document.getElementById('mWin'); w.textContent=s.win_rate.toFixed(1)+'%'; w.style.color=s.win_rate>=0?'var(--red)':'var(--green)';
  let dd=document.getElementById('mDD'); dd.textContent=s.drawdown.toFixed(1)+'%'; dd.style.color=s.drawdown>=0?'var(--red)':'var(--green)';
  document.getElementById('mTrades2').textContent=' • '+s.trades+' 筆';
  let mc=document.getElementById('mMonths'); mc.innerHTML='';
  s.months.forEach(m=>{
    let div=document.createElement('div');
    div.className='month-pill';
    div.style.setProperty('--c', m.value>=0?'var(--red)':'var(--green)');
    div.innerHTML=`<div class="mono" style="font-size:10px;color:var(--muted)">${m.short}</div><div class="mono" style="font-size:13px;font-weight:700;margin-top:2px;color:${m.value>=0?'var(--red)':'var(--green)'}">${m.value>=0?'+':''}${m.value.toFixed(2)}%</div>`;
    mc.appendChild(div);
  });
}
function renderList(){
  let cont=document.getElementById('allList'); cont.innerHTML='';
  strategies.forEach(s=>{
    let b=document.createElement('button');
    b.style.cssText=`width:100%;text-align:left;border-radius:20px;padding:14px;background:var(--card);border:1px solid ${s.id===selectedId?'var(--border)':'var(--border2)'};cursor:pointer;min-width:0`;
    b.onclick=()=>{selectedId=s.id;renderMain();renderList();window.scrollTo({top:0,behavior:'smooth'});};
    let pills=s.months.map(m=>`<div class="month-pill" style="flex:0 0 66px;height:46px;padding:6px 8px;--c:${m.value>=0?'var(--red)':'var(--green)'}"><div class="mono" style="font-size:9px;color:var(--muted)">${m.short}</div><div class="mono" style="font-size:12px;font-weight:700;color:${m.value>=0?'var(--red)':'var(--green)'}">${m.value>=0?'+':''}${m.value.toFixed(2)}%</div></div>`).join('');
    b.innerHTML=`<div style="display:flex;justify-content:space-between;gap:8px"><div style="min-width:0"><div style="font-size:12px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${s.name}</div><div style="margin-top:6px;display:flex;gap:6px"><span class="mono" style="font-size:9px;background:var(--card3);border:1px solid var(--border2);padding:2px 6px;border-radius:6px;color:var(--muted)">${s.id}</span><span class="mono" style="font-size:9px;padding:2px 6px;border-radius:6px;border:1px solid ${s.status==='正常'?'rgba(18,217,138,.28)':s.status==='觀察中'?'rgba(255,174,0,.28)':'rgba(255,77,90,.28)'};background:${s.status==='正常'?'rgba(18,217,138,.14)':s.status==='觀察中'?'rgba(255,174,0,.14)':'rgba(255,77,90,.14)'};color:${s.status==='正常'?'var(--green)':s.status==='觀察中'?'#ffae00':'var(--red)'}">${s.status}</span></div></div><div style="text-align:right;flex-shrink:0"><div class="mono" style="font-size:11px;font-weight:700;color:${s.diff>=0?'var(--red)':'var(--green)'}">${s.diff>0?'+':''}${s.diff.toFixed(1)}% <span style="font-size:9px;color:var(--muted);font-weight:400">超額</span></div><div class="mono" style="font-size:9px;color:var(--muted);margin-top:3px">${s.annual.toFixed(2)}% 年化 • ${s.trades}筆</div></div></div><div class="mono" style="margin-top:8px;font-size:10px;color:var(--muted);background:var(--card3);border:1px solid var(--border2);padding:4px 8px;border-radius:99px;display:inline-block;white-space:nowrap">回測期間：${s.start_date}-${s.end_date}</div><div style="margin-top:10px;display:flex;gap:6px;overflow-x:auto" class="no-scrollbar">${pills}</div>`;
    cont.appendChild(b);
  });
  document.getElementById('totalCount').textContent=strategies.length+' 策略 • 每列獨立月份';
}
function renderDrop(){
  let l=document.getElementById('dropList'); l.innerHTML='';
  strategies.forEach(s=>{
    let b=document.createElement('button');
    b.style.cssText=`width:100%;text-align:left;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;border:none;background:${s.id===selectedId?'var(--card3)':'transparent'};cursor:pointer;color:var(--text);min-width:0`;
    b.innerHTML=`<div style="min-width:0"><div style="font-size:12px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${s.name}</div><div class="mono" style="font-size:10px;color:var(--muted)">${s.id} • ${s.periodShort}</div></div><div style="display:flex;gap:6px;align-items:center;flex-shrink:0"><span class="mono" style="font-size:10px;font-weight:600;color:${s.diff>=0?'var(--red)':'var(--green)'}">${s.diff>0?'+':''}${s.diff.toFixed(1)}%</span><div style="width:7px;height:7px;border-radius:50%;background:${s.status==='正常'?'var(--green)':s.status==='觀察中'?'#ffae00':'var(--red)'}"></div></div>`;
    b.onclick=()=>{selectedId=s.id;document.getElementById('dropList').style.display='none';renderMain();renderList();};
    l.appendChild(b);
  });
}
async function loadCSV(){
  for(let p of ['backtests/summary.csv','./backtests/summary.csv','summary.csv']){
    try{let r=await fetch(p+'?t='+Date.now()); if(r.ok){let t=await r.text(); if(t.trim()) return t;}}catch(e){}
  }
  return MOCK;
}
initTheme();
document.getElementById('themeBtn').onclick=toggleTheme;
(async()=>{
  let txt=await loadCSV(); strategies=parseCSV(txt); if(strategies.length===0) strategies=parseCSV(MOCK);
  selectedId=strategies[0]?.id; renderMain(); renderList(); renderDrop();
  document.getElementById('dropBtn').onclick=()=>{let l=document.getElementById('dropList'); l.style.display=l.style.display==='none'?'block':'none';};
  document.addEventListener('mousedown',e=>{if(!e.target.closest('#dropBtn')&&!e.target.closest('#dropList')) document.getElementById('dropList').style.display='none';});
  function tick(){
    let n=new Date();
    let df=new Intl.DateTimeFormat('zh-TW',{timeZone:'Asia/Taipei',month:'2-digit',day:'2-digit',weekday:'short'});
    let tf=new Intl.DateTimeFormat('zh-TW',{timeZone:'Asia/Taipei',hour:'2-digit',minute:'2-digit',hour12:false});
    document.getElementById('syncTime').textContent=`${df.format(n)} ${tf.format(n)}`;
  }
  tick(); setInterval(tick,30000);
})();
</script>
</body>
</html>
